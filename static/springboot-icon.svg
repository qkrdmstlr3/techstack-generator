<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 28 28" role="img" aria-label="Spring Boot">
  <style>
    .hex  { animation: powerHex 4s ease-in-out infinite; }
    .sym  { animation: powerSym 4s ease-in-out infinite; }
    .glow { animation: powerGlow 4s ease-in-out infinite; opacity: 0; }

    /* El hexagono pasa de apagado al verde de marca */
    @keyframes powerHex {
      0%, 12%   { fill: #2E352A; }
      16%       { fill: #4A7A2C; }
      20%       { fill: #2E352A; }
      26%       { fill: #5A972F; }
      30%       { fill: #3A4A30; }
      38%, 88%  { fill: #6DB33F; }
      100%      { fill: #2E352A; }
    }

    /* El simbolo de encendido parpadea y se queda fijo */
    @keyframes powerSym {
      0%, 12%   { fill: #5A6552; }
      16%       { fill: #E8F7DA; }
      20%       { fill: #5A6552; }
      26%       { fill: #FFFFFF; }
      30%       { fill: #7C8A72; }
      38%, 88%  { fill: #FFFFFF; }
      100%      { fill: #5A6552; }
    }

    /* Halo: destella al arrancar y luego respira */
    @keyframes powerGlow {
      0%, 12%  { opacity: 0; }
      16%      { opacity: .45; }
      20%      { opacity: 0; }
      26%      { opacity: .95; }
      30%      { opacity: .1; }
      38%      { opacity: .7; }
      60%      { opacity: .4; }
      80%      { opacity: .7; }
      92%      { opacity: 0; }
      100%     { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .hex  { animation: none; fill: #6DB33F; }
      .sym  { animation: none; fill: #FFFFFF; }
      .glow { animation: none; opacity: .5; }
    }
  </style>

  <defs>
    <filter id="halo" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Carcasa hexagonal -->
  <path class="hex" d="M 23.693,10.706 L 18.963,2.521 C 18.554,1.811 17.546,1.227 16.723,1.227 L 7.272,1.227 C 6.454,1.227 5.442,1.811 5.032,2.521 L 0.307,10.706 C -0.102,11.416 -0.102,12.579 0.307,13.29 L 5.032,21.479 C 5.442,22.189 6.449,22.773 7.272,22.773 L 16.727,22.773 C 17.546,22.773 18.553,22.189 18.968,21.479 L 23.693,13.29 C 24.102,12.579 24.102,11.416 23.693,10.706 L 23.693,10.706" fill="#2E352A"/>

  <!-- Halo difuminado del simbolo -->
  <g class="glow" filter="url(#halo)" fill="#FFFFFF">
    <path d="M 10.976,5.755 C 10.976,5.218 11.414,4.78 11.95,4.78 C 12.487,4.78 12.925,5.218 12.925,5.755 L 12.925,11.576 C 12.925,12.113 12.487,12.551 11.95,12.551 C 11.414,12.551 10.976,12.113 10.976,11.576 L 10.976,5.755"/>
    <path d="M 11.95,18.184 C 8.308,18.184 5.343,15.219 5.343,11.576 C 5.347,9.487 6.336,7.524 8.011,6.272 A 0.866,0.866 0.0 0,1 9.225,6.451 A 0.866,0.866 0.0 0,1 9.047,7.665 C 6.886,9.27 6.435,12.325 8.039,14.485 C 9.644,16.645 12.699,17.097 14.859,15.492 C 16.097,14.574 16.826,13.12 16.826,11.576 A 4.897,4.897 0.0 0,0 14.84,7.651 C 14.454,7.369 14.374,6.823 14.657,6.437 C 14.939,6.051 15.485,5.971 15.871,6.254 C 17.56,7.501 18.553,9.477 18.558,11.576 C 18.558,15.224 15.593,18.184 11.95,18.184 L 11.95,18.184"/>
  </g>

  <!-- Simbolo de encendido -->
  <g class="sym" fill="#5A6552">
    <path d="M 10.976,5.755 C 10.976,5.218 11.414,4.78 11.95,4.78 C 12.487,4.78 12.925,5.218 12.925,5.755 L 12.925,11.576 C 12.925,12.113 12.487,12.551 11.95,12.551 C 11.414,12.551 10.976,12.113 10.976,11.576 L 10.976,5.755"/>
    <path d="M 11.95,18.184 C 8.308,18.184 5.343,15.219 5.343,11.576 C 5.347,9.487 6.336,7.524 8.011,6.272 A 0.866,0.866 0.0 0,1 9.225,6.451 A 0.866,0.866 0.0 0,1 9.047,7.665 C 6.886,9.27 6.435,12.325 8.039,14.485 C 9.644,16.645 12.699,17.097 14.859,15.492 C 16.097,14.574 16.826,13.12 16.826,11.576 A 4.897,4.897 0.0 0,0 14.84,7.651 C 14.454,7.369 14.374,6.823 14.657,6.437 C 14.939,6.051 15.485,5.971 15.871,6.254 C 17.56,7.501 18.553,9.477 18.558,11.576 C 18.558,15.224 15.593,18.184 11.95,18.184 L 11.95,18.184"/>
  </g>
</svg>
